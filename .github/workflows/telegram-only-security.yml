name: Telegram-Only Security Verification

on:
  push:
    branches:
      - security/telegram-only-bot-notifications
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run verification
        run: |
          echo "Current directory: $(pwd)"
          ls -la telegram_bot/btc_bot.py
          python3 verify_telegram_only.py

