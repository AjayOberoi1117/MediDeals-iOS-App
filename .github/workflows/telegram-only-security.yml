name: Telegram-Only Security Verification

on:
  push:
    branches:
      - security/telegram-only-bot-notifications
  pull_request:
    branches:
      - security/telegram-only-bot-notifications

jobs:
  compile-check:
    name: Python Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45aa312e87f3

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e7e1664e5ff7b7bc6cac0
        with:
          python-version: '3.11'

      - name: Compile all modified bots
        run: |
          python3 -m py_compile \
            telegram_bot/btc_bot.py \
            telegram_bot/forex_scalper.py \
            telegram_bot/gold_bot.py \
            telegram_bot/india_scalper.py \
            telegram_bot/nifty_scalper.py \
            telegram_bot/options_scalper.py \
            telegram_bot/scanner_bot.py \
            telegram_bot/signal_bot.py \
            telegram_bot/test_telegram_only.py
          echo "✓ All files compiled successfully"

  test-telegram-only:
    name: Telegram-Only Tests
    runs-on: ubuntu-latest
    needs: compile-check
    steps:
      - name: Checkout
        uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45aa312e87f3

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e7e1664e5ff7b7bc6cac0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --no-cache-dir pandas yfinance requests pytz nse-holidays --quiet

      - name: Run Telegram-only tests
        run: |
          cd /home/runner/work/MediDeals-iOS-App/MediDeals-iOS-App || pwd
          python3 -m unittest telegram_bot.test_telegram_only -v

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45aa312e87f3
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets
        run: |
          echo "Checking for hardcoded credentials in Python files..."
          set +e
          FOUND=0

          # Check for hardcoded tokens/passwords
          if grep -r 'UPSTOX_TOKEN\s*=\s*"[^"]*[a-zA-Z0-9]{50}' telegram_bot/*.py 2>/dev/null | grep -v os.getenv | grep -v test_; then
            echo "FAIL: Hardcoded Upstox token found"
            FOUND=1
          fi

          if grep -r 'Bearer EAAL[A-Za-z0-9]' telegram_bot/*.py 2>/dev/null | grep -v test_; then
            echo "FAIL: Hardcoded WhatsApp token found"
            FOUND=1
          fi

          if grep -r 'vstbuutmlhbxbpww' telegram_bot/*.py 2>/dev/null; then
            echo "FAIL: Hardcoded Gmail password found"
            FOUND=1
          fi

          set -e
          if [ $FOUND -eq 1 ]; then
            exit 1
          fi
          echo "✓ No hardcoded secrets found"

      - name: Verify notification removal
        run: |
          echo "Checking email/WhatsApp removal..."
          set +e
          FAIL=0

          # Verify emailer.py and whatsapp.py are deleted
          if [ -f telegram_bot/emailer.py ] || [ -f telegram_bot/whatsapp.py ]; then
            echo "FAIL: Helper modules still exist"
            FAIL=1
          fi

          # Verify no email imports
          if grep -r "import smtplib\|from email.mime" telegram_bot/*.py 2>/dev/null | grep -v test_; then
            echo "FAIL: Email imports found"
            FAIL=1
          fi

          # Verify no WhatsApp API URLs
          if grep -r "graph.facebook.com" telegram_bot/*.py 2>/dev/null | grep -v test_; then
            echo "FAIL: WhatsApp API URLs found"
            FAIL=1
          fi

          set -e
          if [ $FAIL -eq 0 ]; then
            echo "✓ Email and WhatsApp successfully removed"
          else
            exit 1
          fi

  scope-validation:
    name: Diff Scope Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45aa312e87f3
        with:
          fetch-depth: 0

      - name: Verify scope
        run: |
          echo "Validating diff scope..."
          set +e
          FAIL=0

          # Get list of changed files - handle both push and PR scenarios
          if [ -n "${{ github.base_ref }}" ]; then
            # PR scenario
            git fetch origin ${{ github.base_ref }} --quiet
            CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            # Push scenario - compare with previous commit
            if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
              CHANGED_FILES=$(git diff --name-only ${{ github.event.before }}...HEAD)
            else
              # Initial commit - just validate current files
              CHANGED_FILES=$(git ls-files telegram_bot/*.py)
            fi
          fi

          # Verify no watchdog/strategy files were changed
          if echo "$CHANGED_FILES" | grep -E "watchdog|strategy|executor|trader|deploy"; then
            echo "FAIL: Scope violation — non-notification files modified"
            FAIL=1
          fi

          set -e
          if [ $FAIL -eq 0 ]; then
            echo "✓ Scope validation passed"
          else
            exit 1
          fi

