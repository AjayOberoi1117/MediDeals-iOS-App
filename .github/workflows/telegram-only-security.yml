name: Telegram-Only Security Verification

on:
  push:
    branches:
      - security/telegram-only-bot-notifications
  pull_request:
    branches:
      - security/telegram-only-bot-notifications

jobs:
  compile-check:
    name: Python Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45aa312e87f3

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e7e1664e5ff7b7bc6cac0
        with:
          python-version: '3.11'

      - name: Compile all modified bots
        run: |
          python3 << 'EOF'
          import py_compile
          files = [
            'telegram_bot/btc_bot.py',
            'telegram_bot/forex_scalper.py',
            'telegram_bot/gold_bot.py',
            'telegram_bot/india_scalper.py',
            'telegram_bot/nifty_scalper.py',
            'telegram_bot/options_scalper.py',
            'telegram_bot/scanner_bot.py',
            'telegram_bot/signal_bot.py',
            'telegram_bot/test_telegram_only.py',
          ]
          for f in files:
            try:
              py_compile.compile(f, doraise=True)
              print(f"✓ {f}")
            except py_compile.PyCompileError as e:
              print(f"✗ {f}: {e}")
              exit(1)
          print("\n✓ All files compiled successfully")
          EOF

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45aa312e87f3
        with:
          fetch-depth: 0

      - name: Verify no hardcoded secrets
        run: |
          python3 << 'EOF'
          import os
          import re

          # Patterns for potential secrets
          patterns = {
              'bearer_token': r'Bearer\s+[A-Za-z0-9]{20,}',
              'jwt_token': r'eyJ0eXA.*[A-Za-z0-9]{50,}',
              'email_password': r'vstbuutmlhbxbpww',
              'phone_number': r'"919[0-9]{9}',
          }

          failed = False
          for root, dirs, files in os.walk('telegram_bot'):
              # Skip test file for phone number check (it has patterns to check for)
              for f in files:
                  if not f.endswith('.py'):
                      continue
                  if f == 'test_telegram_only.py':
                      continue

                  path = os.path.join(root, f)
                  with open(path) as fp:
                      content = fp.read()

                  # Skip os.getenv lines
                  lines = content.split('\n')
                  for i, line in enumerate(lines, 1):
                      if 'os.getenv' in line:
                          continue
                      for name, pattern in patterns.items():
                          if re.search(pattern, line):
                              print(f"FAIL: {path}:{i} - {name} detected")
                              failed = True

          if failed:
              exit(1)
          else:
              print("✓ No hardcoded secrets found")
          EOF

      - name: Verify notification removal
        run: |
          python3 << 'EOF'
          import os

          # Check for deleted files
          for f in ['telegram_bot/emailer.py', 'telegram_bot/whatsapp.py']:
              if os.path.exists(f):
                  print(f"FAIL: {f} still exists")
                  exit(1)

          print("✓ Helper modules removed")

          # Check for email/WhatsApp imports
          failed = False
          for root, dirs, files in os.walk('telegram_bot'):
              for f in files:
                  if not f.endswith('.py') or f == 'test_telegram_only.py':
                      continue

                  path = os.path.join(root, f)
                  with open(path) as fp:
                      content = fp.read()

                  if 'import smtplib' in content or 'from email.mime' in content:
                      print(f"FAIL: {path} - email imports found")
                      failed = True

                  if 'graph.facebook.com' in content:
                      print(f"FAIL: {path} - WhatsApp URLs found")
                      failed = True

          if failed:
              exit(1)

          print("✓ Email and WhatsApp successfully removed")
          EOF

