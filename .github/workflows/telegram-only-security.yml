name: Telegram-Only Security Verification

on:
  push:
    branches:
      - security/telegram-only-bot-notifications
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45aa312e87f3

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e7e1664e5ff7b7bc6cac0
        with:
          python-version: '3.11'

      - name: Test Python
        run: python3 test_ci.py

      - name: Verify changes
        run: python3 verify_telegram_only.py

