name: Telegram-Only Security Verification

on:
  push:
    branches:
      - security/telegram-only-bot-notifications
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45aa312e87f3

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e7e1664e5ff7b7bc6cac0
        with:
          python-version: '3.11'

      - name: Verify changes
        run: |
          python3 -c '
          import os, sys, py_compile
          bot_files = [
              "telegram_bot/btc_bot.py",
              "telegram_bot/forex_scalper.py",
              "telegram_bot/gold_bot.py",
              "telegram_bot/india_scalper.py",
              "telegram_bot/nifty_scalper.py",
              "telegram_bot/options_scalper.py",
              "telegram_bot/scanner_bot.py",
              "telegram_bot/signal_bot.py",
              "telegram_bot/test_telegram_only.py",
          ]
          print("=" * 60)
          print("VERIFYING TELEGRAM-ONLY NOTIFICATION CHANGES")
          print("=" * 60)
          print("\n[1] Python Compilation Check")
          for f in bot_files:
              try:
                  py_compile.compile(f, doraise=True)
                  print(f"  ✓ {f}")
              except Exception as e:
                  print(f"  ✗ {f}: {e}")
                  sys.exit(1)
          print("\n[2] Helper Modules Check")
          if os.path.exists("telegram_bot/emailer.py"):
              print("  ✗ emailer.py still exists")
              sys.exit(1)
          if os.path.exists("telegram_bot/whatsapp.py"):
              print("  ✗ whatsapp.py still exists")
              sys.exit(1)
          print("  ✓ emailer.py deleted")
          print("  ✓ whatsapp.py deleted")
          print("\n[3] Email/WhatsApp Import Check")
          for bot_file in bot_files[:-1]:
              with open(bot_file) as f:
                  content = f.read()
              for pattern in ["import smtplib", "from email.mime", "graph.facebook.com"]:
                  if pattern in content:
                      print(f"  ✗ {bot_file}: found '"'"'{pattern}'"'"'")
                      sys.exit(1)
              print(f"  ✓ {bot_file}")
          print("\n[4] Hardcoded Credentials Check")
          for bot_file in bot_files[:-1]:
              with open(bot_file) as f:
                  content = f.read()
              for pattern in ["Bearer EAAL", "vstbuutmlhbxbpww"]:
                  if pattern in content:
                      print(f"  ✗ {bot_file}: found '"'"'{pattern}'"'"'")
                      sys.exit(1)
              print(f"  ✓ {bot_file}")
          print("\n" + "=" * 60)
          print("✓ ALL CHECKS PASSED")
          print("=" * 60)
          '

