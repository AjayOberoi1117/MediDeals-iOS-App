name: Telegram-Only Security Verification

on:
  push:
    branches:
      - security/telegram-only-bot-notifications
  pull_request:
    branches:
      - security/telegram-only-bot-notifications

jobs:
  verify-changes:
    name: Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a81bbbf8298c0fa03ea29cdc473d45aa312e87f3

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e7e1664e5ff7b7bc6cac0
        with:
          python-version: '3.11'

      - name: Compile all bot files
        run: |
          python3 -m py_compile \
            telegram_bot/btc_bot.py \
            telegram_bot/forex_scalper.py \
            telegram_bot/gold_bot.py \
            telegram_bot/india_scalper.py \
            telegram_bot/nifty_scalper.py \
            telegram_bot/options_scalper.py \
            telegram_bot/scanner_bot.py \
            telegram_bot/signal_bot.py \
            telegram_bot/test_telegram_only.py
          echo "✓ All files compiled"

      - name: Verify email/WhatsApp removal
        run: |
          # Check helper modules deleted
          test ! -f telegram_bot/emailer.py || (echo "FAIL: emailer.py exists" && exit 1)
          test ! -f telegram_bot/whatsapp.py || (echo "FAIL: whatsapp.py exists" && exit 1)

          # Check no email imports in bot files (excluding test file)
          ! grep "import smtplib\|from email.mime" \
            telegram_bot/btc_bot.py \
            telegram_bot/forex_scalper.py \
            telegram_bot/gold_bot.py \
            telegram_bot/india_scalper.py \
            telegram_bot/nifty_scalper.py \
            telegram_bot/options_scalper.py \
            telegram_bot/scanner_bot.py \
            telegram_bot/signal_bot.py

          # Check no WhatsApp URLs in bot files (excluding test file)
          ! grep "graph.facebook.com" \
            telegram_bot/btc_bot.py \
            telegram_bot/forex_scalper.py \
            telegram_bot/gold_bot.py \
            telegram_bot/india_scalper.py \
            telegram_bot/nifty_scalper.py \
            telegram_bot/options_scalper.py \
            telegram_bot/scanner_bot.py \
            telegram_bot/signal_bot.py

          echo "✓ Email and WhatsApp removed"

      - name: Verify no hardcoded credentials
        run: |
          # Quick check - no obvious credential patterns in bot files
          # (excluding test file which has patterns to check for)
          ! grep "Bearer EAAL\|vstbuutmlhbxbpww" \
            telegram_bot/btc_bot.py \
            telegram_bot/forex_scalper.py \
            telegram_bot/gold_bot.py \
            telegram_bot/india_scalper.py \
            telegram_bot/nifty_scalper.py \
            telegram_bot/options_scalper.py \
            telegram_bot/scanner_bot.py \
            telegram_bot/signal_bot.py

          echo "✓ No obvious hardcoded credentials"

      - name: Verify compilation and structure
        run: |
          echo "✓ CI verification complete - all checks passed"

